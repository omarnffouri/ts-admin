  flutter_gen_runner: # flutter pub run build_runner build
  build_runner:
  flutter_test:
    sdk: flutter

flutter_gen:
  output: lib/app/core/gen/

flutter_launcher_icons:
  image_path_android: "assets/images/ts.png"
  image_path_ios: "assets/images/ts.png"
  # adaptive_icon_foreground: "assets/images/ts.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # adaptive_icon_background: "assets/images/red.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/chat_icons/
    - assets/jsons/
    - assets/sounds/

fonts:
  - family: Poppins
    fonts:
      - asset: fonts/Poppins-Regular.ttf
  - family: Helvetica
    fonts:
      - asset: fonts/Helvetica.ttf
